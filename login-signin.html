<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Bugatti</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="container">
      <div class="header">
        <img class="logo" src="images/logo-bugatti.png" alt="BUGATTI" />
        <a href="home-page.html">← Quay lại trang chủ</a>
      </div>

      <main class="form-page">
        <div class="section form-intro">
          <p>MY BUGATTI</p>
          <h1>Chào mừng đến với Bugatti Atelier</h1>
          <p>
            Đăng nhập hoặc tạo tài khoản để gửi yêu cầu tư vấn và nhận thông tin
            mới nhất.
          </p>
        </div>

        <div class="form-list">
          <form action="home-page.html" method="get">
            <h2>Đăng nhập</h2>
            <label for="login-email">Email</label>
            <input
              id="login-email"
              type="email"
              name="email"
              placeholder="name@example.com"
              required
            />

            <label for="login-password">Mật khẩu</label>
            <input
              id="login-password"
              type="password"
              name="password"
              placeholder="Nhập mật khẩu"
              required
            />

            <label
              ><input type="checkbox" name="remember" /> Ghi nhớ đăng
              nhập</label
            >
            <button class="button" type="submit">ĐĂNG NHẬP</button>
          </form>

          <form action="home-page.html" method="get">
            <h2>Đăng ký</h2>
            <label for="name">Họ và tên</label>
            <input
              id="name"
              type="text"
              name="name"
              placeholder="Nguyễn Văn A"
              required
            />

            <label for="email">Email</label>
            <input
              id="email"
              type="email"
              name="email"
              placeholder="name@example.com"
              required
            />

            <label for="country">Quốc gia</label>
            <select id="country" name="country">
              <option>Việt Nam</option>
              <option>France</option>
              <option>Quốc gia khác</option>
            </select>

            <label for="password">Mật khẩu</label>
            <input
              id="password"
              type="password"
              name="password"
              placeholder="Tạo mật khẩu"
              required
            />

            <label
              ><input type="checkbox" required /> Tôi đồng ý nhận thông tin từ
              Bugatti.</label
            >
            <button class="button" type="submit">TẠO TÀI KHOẢN</button>
          </form>
        </div>
      </main>

      <footer>
        <p>© 2026 BUGATTI ATELIER</p>
        <a href="introducing.html#contact">Liên hệ</a>
      </footer>
    </div>
  </body>
</html>
